name: Deploy web build

# Builds the WebAssembly version on every push to main and publishes it to
# GitHub Pages, so the game is playable at:
#   https://<owner>.github.io/monster-colony/
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". (This workflow otherwise handles everything.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build the web game
        run: make web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
