<!doctype html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

	<title>Monster Colony</title>
	<meta name="title" content="Monster Colony">
	<meta name="description" content="An Odin + raylib colony builder in an infinite hex underground.">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: #0a0c10;
			touch-action: none;
		}
		canvas.game_canvas {
			display: block;
			width: 100vw;
			height: 100vh;
			border: 0 none;
			background-color: #0a0c10;
			outline: none;
		}
		#loading {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #c8c8dc;
			font: 20px monospace;
			pointer-events: none;
		}
		#fs {
			position: absolute;
			top: 10px;
			right: 10px;
			z-index: 10;
			padding: 6px 12px;
			font: 14px monospace;
			color: #dfe2ee;
			background: rgba(20, 22, 30, 0.7);
			border: 1px solid rgba(150, 160, 190, 0.5);
			border-radius: 6px;
			cursor: pointer;
			opacity: 0.55;
			transition: opacity 0.15s;
		}
		#fs:hover { opacity: 1; }
		#fs:fullscreen { display: none; }
	</style>
</head>
<body>
	<div id="loading">loading Monster Colony…</div>
	<button id="fs" title="Toggle fullscreen (F)">⛶ Fullscreen</button>
	<canvas class="game_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>
	<script type="text/javascript" src="odin.js"></script>
	<script>
		var odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		var odinImports = odin.setupDefaultImports(odinMemoryInterface);

		// Fullscreen toggle (button + F key).
		function toggle_fullscreen() {
			var el = document.documentElement;
			if (!document.fullscreenElement) {
				(el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
			} else {
				(document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
			}
		}
		document.getElementById("fs").addEventListener("click", toggle_fullscreen);
		window.addEventListener("keydown", function(ev) {
			if (ev.key === "f" || ev.key === "F") toggle_fullscreen();
		});

		// The Module is used as configuration for emscripten.
		var Module = {
			instantiateWasm: (imports, successCallback) => {
				const newImports = {
					...odinImports,
					...imports
				}

				return WebAssembly.instantiateStreaming(fetch("index.wasm"), newImports).then(function(output) {
					var e = output.instance.exports;
					odinMemoryInterface.setExports(e);
					odinMemoryInterface.setMemory(e.memory);
					return successCallback(output.instance);
				});
			},
			onRuntimeInitialized: () => {
				var e = wasmExports;

				// Calls any procedure marked with @init
				e._start();

				var loading = document.getElementById("loading");
				if (loading) loading.remove();

				// See src/web.odin for main_start / main_update / main_end.
				e.main_start();

				// Keep the game's render size matched to the window/viewport so it
				// fills the screen and reflows on resize / fullscreen.
				function send_resize() {
					e.web_window_size_changed(window.innerWidth, window.innerHeight);
				}
				window.addEventListener("resize", send_resize, true);
				document.addEventListener("fullscreenchange", send_resize);
				send_resize();

				function do_main_update() {
					if (!e.main_update()) {
						e.main_end();
						// Calls procedures marked with @fini
						e._end();
						return;
					}
					window.requestAnimationFrame(do_main_update);
				}

				window.requestAnimationFrame(do_main_update);
			},
			print: (function() {
				return function(text) {
					if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
					console.log(text);
				};
			})(),
			canvas: (function() {
				return document.getElementById("canvas");
			})()
		};
	</script>

	<!-- Emscripten injects its javascript here -->
	{{{ SCRIPT }}}
</body>
</html>
